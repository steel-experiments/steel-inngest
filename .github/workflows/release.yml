name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package version
        run: |
          node --input-type=module -e '
            import manifest from "./package.json" with { type: "json" };
            const expected = `v${manifest.version}`;
            const actual = process.env.GITHUB_REF_NAME;
            if (actual !== expected) {
              throw new Error(`Tag ${actual} does not match package version ${expected}`);
            }
          '

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: npm run check

      - name: Verify package consumers
        run: npm run check:package

      - name: Publish with trusted publishing
        run: npm publish

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            index($0, "## " ver " ") == 1 { found = 1; next }
            /^## / && found { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q "[^[:space:]]" release-notes.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          printf '\n**Full changelog**: %s\nnpm: %s\n' \
            "https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md" \
            "https://www.npmjs.com/package/steel-inngest/v/${version}" \
            >> release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --notes-file release-notes.md
