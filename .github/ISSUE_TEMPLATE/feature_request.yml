name: Feature request
description: Propose a focused addition to steel-inngest
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What workflow is difficult with the current API?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: Show the TypeScript call site you would like to use.
    validations:
      required: true
  - type: textarea
    id: durability
    attributes:
      label: Replay and lifecycle considerations
      description: Note any effect on step IDs, retries, session release, or credentials.
